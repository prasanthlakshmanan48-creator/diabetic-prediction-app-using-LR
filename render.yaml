services:
  # =============================================================
  # Diabetes Risk Prediction Full-Stack Web Application (Flask UI)
  # =============================================================
  - type: web
    name: diabetes-risk-prediction
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DATABASE_URL
        value: "sqlite:///instance/diabetes.db"
      - key: SECRET_KEY
        generateValue: true
